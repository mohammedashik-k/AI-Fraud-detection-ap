services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelpay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinelpay
      POSTGRES_PASSWORD: sentinelpay
      POSTGRES_DB: sentinelpay
    ports:
      - "5432:5432"
    volumes:
      - sentinelpay_pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  sentinelpay_pgdata:
